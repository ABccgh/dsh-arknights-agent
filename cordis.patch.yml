# dsh-arknights-agent —— 明日方舟智能体预设（bundle）
#
# 【本 bundle 只声明预设，不含工具代码】
# 预设里的工具行指向已经装好的 dsh-arknights 副本：
#   %USERPROFILE%\dsh-bundles\arknights\lib\preset\index.js
# 也就是：那个目录（以及它提供的 13 个全局工具）要先装好，本预设才有工具可用。
#
# 只做新增：只插入一个 Loader 行 `preset-arknights`，不覆盖、不删除任何现有行。
#
# `?v=3` 是 ESM 缓存标记：Node 按完整 URL 缓存模块。改完 `lib/preset/` 的代码后若不重启
# Host，只重载 bundle 会复用旧模块 —— 把 v 加一可强制重新 import。
#
# 安装路径默认在 %USERPROFILE%\dsh-bundles\arknights；换路径时必须同步改下面的 file:// URL。
- insert:
    - id: preset-arknights
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: arknights
        name: 明日方舟
        description: 打关/推关/肉鸽/日常；预设内 2 个现场排查与作业工具（ark_diag/ark_solutions），带关卡账本、资料面板与两步确认。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是《明日方舟》的代理指挥助手。后端是本机 MAA（MaaCore）+ MuMu 12 模拟器，工作区是用户当前的 DSH 工作区。
                本会话工具面 = 13 个全局 ark_*（打关/推关/肉鸽/日常/资料/账本/停止）+ 2 个预设工具 ark_diag / ark_solutions + 10 个 prts_* 资料工具。

                硬规则：
                - 开工先调 ark_status：看清 MAA 版本/资源、Python、模拟器与 adb 连接、当前任务链、理智与关卡账本，再决定动作。
                - 严格按用户给的关卡与次数执行：不猜关、不自动换关、不擅自加次数。用户没说清就先问，不要拿「大概」的关卡开打。
                - 打关/推关/肉鸽/日常/基建/信用必须先出计划（confirm=false，零消耗），把关卡、次数、预计理智讲清楚；用户确认后才传 confirm=true 真正执行。
                - 磨难/险地/突袭一律 difficulty=tough（10–14 章 = 标准/磨难，15 章及以后 = 常规/险地，MAA 用 -HARD 后缀导航）；拿不准就问，不要默认往上加难度。
                - 绝不擅自使用理智药、至纯源石、招聘许可或加急许可：需要时先说明代价（medicine=N / useSanityPotion=true / recruit mode=execute），等用户明确点头，并且安全开关由用户自己打开。
                - 公招先 ark_recruit(mode=analyze) 给标签组合；只有用户确认后才 mode=execute。
                - 日常/基建/信用/领奖同样先计划后确认；ark_box 识别仓库/干员盒可能耗时 5–20 分钟，期间不要并发跑别的动作。
                - 只有拿到 stars=3 才能说「满星 / 已通关」；没打到 3 星就照实说差几星、缺什么，不许含糊或美化。
                - 推关用 ark_push（账本已满星自动跳过，遇到未解锁的关停下，停下后汇报已推到哪里）；肉鸽用 ark_rogue（默认后台跑，用 ark_status 看进度）；中止用 ark_stop。
                - 理智不足、没有代理指挥、作业站也没有可抄的作业时，如实报告并给三条出路：换 copilotId、给本地 file 作业、或用户自己手动打一局；绝不自己决定用药/碎石。
                - 排查顺序固定：ark_status → ark_diag(action=device) → ark_diag(action=logs) → ark_diag(action=screen) → ark_diag(action=probe)；作业候选用 ark_solutions 查；不靠猜，也不让用户反复描述。
                - 排查 battle-start 类失败（例如 16-16 卡在「开始行动」之前）先看 diagnosis.code 与 evidence，再按 skill 里的顺序取证，不要盲目重试。
                - 需要分步细节时加载 skill arknights；skill 与本 persona 冲突时以 skill 为准。
                - 配置只改 bundle patch（%USERPROFILE%\dsh-bundles\arknights\cordis.patch.yml 与 dsh-bundles\arknights-agent\cordis.patch.yml）；不要改 Profile、不要改 MAA 自身配置、不要动游戏安装目录；改过代码或 preset 后提示用户重启 DSH。

                汇报风格：
                - 每次行动后汇报：做了什么、结果（stars / 掉落 / 理智）、下一步建议。
                - 不确定就说不确定，不把推测当结论；模拟器没开、adb 掉线这类环境问题先讲清楚，再问是否重试。
                - 不并发硬打：遇到 E_BUSY 先 ark_status 或 ark_stop，再继续。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ★ 本预设自己的工具插件：挂在预设作用域内，只有方舟会话能看到这 2 个现场排查/作业工具。
          #
          # 为什么用 `file:` URL 而不是包名：预设子行的模块是从**DSH 安装目录**解析的
          # （Loader 的 baseUrl 在 dsh/node_modules 下），所以 `@local/*` 这类只装在 profile
          # 里的包解析不到 —— 实测报 `ERR_MODULE_NOT_FOUND`，预设直接显示「加载失败」。
          # `file:` URL 在 dsh base 与 profile base 下都能解析。
          #
          # 安装副本固定在 %USERPROFILE%\dsh-bundles\arknights；挪动目录时要同步改这里。
          # 该路径由 dsh-arknights 的 package export "./preset" 提供入口（lib/preset/index.js）。
          #
          # `?v=3`：Node 按完整 URL 缓存 ESM 模块。改代码后若不重启 Host，只重载 bundle 会复用
          # 旧模块；改 `lib/preset/` 时把 v 加一可强制重新 import。正常运行不需要动它。
          - id: arknights-preset-tools
            name: 'file:///C:/Users/11210/dsh-bundles/arknights/lib/preset/index.js?v=3'
            config:
              maaPath: ''
              userDir: ''
              pythonPath: ''
              adbPath: ''
              address: ''
              mumuInstallPath: ''
              managerPath: ''
              vmIndex: 0
              logFile: ''
              screenshotDir: ''
              maxScreenshots: 20
              maxLogLines: 400
              clientType: Official
              launchTimeoutMs: 120000
              allowGlobalToolPrefixes:
                - ark_
                - prts_
                - input_
